<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chatverix — Create Account</title>
  <meta name="theme-color" content="#071018">

  <link rel="icon" type="image/png" href="FAVICON.png?v=3">

  <style>
    :root {
      --bg: #050b10;
      --panel: rgba(13, 25, 32, 0.82);

      --border: rgba(255, 255, 255, 0.075);

      --text: #f4f8f6;
      --muted: #91a19f;
      --muted-2: #667673;

      --accent: #25d366;
      --accent-2: #1ebe57;

      --danger: #ff5c68;
      --warning: #f5c451;

      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;

      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(37, 211, 102, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 88% 85%,
          rgba(43, 103, 255, 0.09),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #03080c,
          #071018 45%,
          #06131a
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px 12px;

      overflow-x: hidden;
    }

    /* BACKGROUND */

    .background {
      position: fixed;
      inset: 0;

      pointer-events: none;

      overflow: hidden;
    }

    .orb {
      position: absolute;

      border-radius: 50%;

      filter: blur(80px);

      opacity: .24;

      animation:
        floatOrb 12s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 290px;
      height: 290px;

      left: -100px;
      top: -90px;

      background: rgba(37, 211, 102, .14);
    }

    .orb.two {
      width: 250px;
      height: 250px;

      right: -90px;
      bottom: -80px;

      background: rgba(36, 100, 255, .12);

      animation-delay: -5s;
    }

    .orb.three {
      width: 150px;
      height: 150px;

      right: 18%;
      top: 8%;

      background: rgba(37, 211, 102, .07);

      animation-delay: -8s;
    }

    @keyframes floatOrb {

      from {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      to {
        transform:
          translate3d(25px, -20px, 0)
          scale(1.08);
      }

    }

    /* CARD */

    .auth-shell {
      width: min(455px, 100%);

      position: relative;
      z-index: 2;

      animation:
        shellIn .65s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes shellIn {

      from {
        opacity: 0;
        transform:
          translateY(18px)
          scale(.98);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

    }

    .auth-card {

      position: relative;

      padding: 32px;

      border-radius: var(--radius);

      border:
        1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          rgba(20, 36, 43, .88),
          rgba(8, 17, 23, .94)
        );

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 30px 80px rgba(0,0,0,.46),
        inset 0 1px 0 rgba(255,255,255,.035);
    }

    .auth-card::before {

      content: "";

      position: absolute;

      top: 0;
      left: 15%;

      width: 70%;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(37,211,102,.55),
          transparent
        );
    }

    /* BRAND */

    .brand {
      text-align: center;

      margin-bottom: 24px;
    }

    .brand-icon {

      width: 58px;
      height: 58px;

      margin:
        0 auto 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(37,211,102,.20),
          rgba(37,211,102,.045)
        );

      border:
        1px solid rgba(37,211,102,.18);

      box-shadow:
        0 12px 35px rgba(37,211,102,.09);

      animation:
        iconFloat 4s ease-in-out infinite;
    }

    .brand-icon span {
      font-size: 27px;
    }

    @keyframes iconFloat {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }

    }

    .brand-name {

      margin: 0;

      font-size: 29px;
      font-weight: 800;

      letter-spacing: -1px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #b8f8cc
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .brand-subtitle {

      margin: 6px 0 0;

      color: var(--muted);

      font-size: 12px;
    }

    .title {

      margin: 0 0 6px;

      text-align: center;

      font-size: 21px;
      font-weight: 700;
    }

    .subtitle {

      margin: 0 0 20px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;
    }

    /* GOOGLE */

    .google-btn {

      width: 100%;
      height: 47px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      border:
        1px solid rgba(255,255,255,.11);

      border-radius: 13px;

      background: rgba(255,255,255,.96);

      color: #111;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .google-btn:hover {

      transform: translateY(-2px);

      box-shadow:
        0 10px 25px rgba(0,0,0,.22);
    }

    .google-btn:active {

      transform:
        translateY(0)
        scale(.985);
    }

    .google-btn img {

      width: 18px;
      height: 18px;
    }

    /* DIVIDER */

    .divider {

      display: flex;

      align-items: center;

      gap: 12px;

      margin: 19px 0;
    }

    .divider span {

      height: 1px;

      flex: 1;

      background:
        rgba(255,255,255,.07);
    }

    .divider p {

      margin: 0;

      color: var(--muted-2);

      font-size: 11px;
    }

    /* FORM */

    .field {

      margin-bottom: 12px;
    }

    .field-label {

      display: block;

      margin-bottom: 6px;

      color: #b9c5c2;

      font-size: 11px;

      font-weight: 600;
    }

    .input-wrap {

      position: relative;
    }

    input {

      width: 100%;
      height: 46px;

      padding:
        0 13px;

      border:
        1px solid rgba(255,255,255,.075);

      border-radius: 12px;

      outline: none;

      background:
        rgba(2,10,15,.70);

      color: white;

      font-size: 13px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input::placeholder {
      color: #536360;
    }

    input:focus {

      border-color:
        rgba(37,211,102,.48);

      background:
        rgba(2,10,15,.88);

      box-shadow:
        0 0 0 3px
        rgba(37,211,102,.08);
    }

    .password-input {
      padding-right: 48px;
    }

    .password-toggle {

      position: absolute;

      right: 5px;
      top: 4px;

      width: 37px;
      height: 37px;

      border: 0;
      border-radius: 9px;

      background: transparent;

      color: #74817e;

      cursor: pointer;

      transition:
        color .2s ease,
        background .2s ease;
    }

    .password-toggle:hover {

      color: white;

      background:
        rgba(255,255,255,.06);
    }

    /* USERNAME INFO */

    .field-hint {

      display: flex;

      justify-content: space-between;

      margin-top: 5px;

      color: var(--muted-2);

      font-size: 10px;
    }

    .username-status {

      transition: color .2s ease;
    }

    .username-status.good {
      color: var(--accent);
    }

    .username-status.bad {
      color: var(--danger);
    }

    /* PASSWORD STRENGTH */

    .strength {

      height: 4px;

      margin-top: 7px;

      overflow: hidden;

      border-radius: 10px;

      background:
        rgba(255,255,255,.06);
    }

    .strength-bar {

      width: 0%;
      height: 100%;

      border-radius: inherit;

      transition:
        width .3s ease,
        background .3s ease;
    }

    .strength-text {

      display: block;

      margin-top: 5px;

      color: var(--muted-2);

      font-size: 10px;
    }

    /* CHECK */

    .terms {

      display: flex;

      align-items: flex-start;

      gap: 8px;

      margin:
        5px 1px 16px;

      color: var(--muted);

      font-size: 10px;

      line-height: 1.45;

      cursor: pointer;
    }

    .terms input {

      flex: 0 0 auto;

      width: 14px;
      height: 14px;

      margin-top: 1px;

      accent-color: var(--accent);
    }

    /* BUTTON */

    .primary-btn {

      width: 100%;
      height: 48px;

      border: 0;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #2bdd6d,
          #1ebd58
        );

      color: #031009;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 10px 25px
        rgba(37,211,102,.13);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
    }

    .primary-btn:hover {

      transform: translateY(-2px);

      filter: brightness(1.04);

      box-shadow:
        0 14px 30px
        rgba(37,211,102,.18);
    }

    .primary-btn:active {

      transform:
        translateY(0)
        scale(.985);
    }

    .primary-btn.loading {

      opacity: .72;

      pointer-events: none;
    }

    /* SPINNER */

    .spinner {

      display: inline-block;

      width: 17px;
      height: 17px;

      border:
        2px solid rgba(0,0,0,.20);

      border-top-color:
        #031009;

      border-radius: 50%;

      animation:
        spin .7s linear infinite;

      vertical-align: middle;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    /* MESSAGE */

    .message {

      display: none;

      margin-top: 13px;

      padding: 10px 12px;

      border-radius: 11px;

      font-size: 11px;

      line-height: 1.45;

      animation:
        messageIn .25s ease;
    }

    .message.show {
      display: block;
    }

    .message.error {

      color: #ffb7bd;

      background:
        rgba(255,92,104,.08);

      border:
        1px solid rgba(255,92,104,.15);
    }

    .message.success {

      color: #a8efbd;

      background:
        rgba(37,211,102,.08);

      border:
        1px solid rgba(37,211,102,.15);
    }

    @keyframes messageIn {

      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    /* FOOTER */

    .switch-auth {

      margin:
        18px 0 0;

      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }

    .switch-auth a {

      color: #7ae49a;

      font-weight: 700;

      text-decoration: none;
    }

    .switch-auth a:hover {
      text-decoration: underline;
    }

    .footer-note {

      margin-top: 15px;

      text-align: center;

      color: #4e5d59;

      font-size: 10px;
    }

    /* MOBILE */

    @media (max-width: 520px) {

      body {
        align-items: flex-start;
      }

      .auth-shell {
        margin: 10px 0;
      }

      .auth-card {

        padding:
          25px 20px;

        border-radius: 19px;
      }

      .brand-name {
        font-size: 27px;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration: .01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;
      }

    }
  </style>
</head>

<body>

  <div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>

  <main class="auth-shell">

    <section class="auth-card">

      <div class="brand">

        <div class="brand-icon">
          <span>💬</span>
        </div>

        <h1 class="brand-name">
          Chatverix
        </h1>

        <p class="brand-subtitle">
          Your conversations. Your rooms. Your space.
        </p>

      </div>

      <h2 class="title">
        Create your account
      </h2>

      <p class="subtitle">
        Join Chatverix and start chatting.
      </p>


      <!-- GOOGLE -->

      <button
        id="googleBtn"
        class="google-btn"
        type="button"
      >

        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt=""
        >

        <span>
          Continue with Google
        </span>

      </button>


      <div class="divider">

        <span></span>

        <p>OR</p>

        <span></span>

      </div>


      <!-- FORM -->

      <form id="signupForm">

        <!-- USERNAME -->

        <div class="field">

          <label
            class="field-label"
            for="username"
          >
            Username
          </label>

          <input
            id="username"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            maxlength="24"
            required
          >

          <div class="field-hint">

            <span>
              3–24 characters
            </span>

            <span
              id="usernameStatus"
              class="username-status"
            ></span>

          </div>

        </div>


        <!-- NICKNAME -->

        <div class="field">

          <label
            class="field-label"
            for="nickname"
          >
            Nickname
          </label>

          <input
            id="nickname"
            type="text"
            placeholder="What should people call you?"
            autocomplete="nickname"
            maxlength="30"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="field">

          <label
            class="field-label"
            for="email"
          >
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label
            class="field-label"
            for="password"
          >
            Password
          </label>

          <div class="input-wrap">

            <input
              id="password"
              class="password-input"
              type="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              id="passwordToggle"
              class="password-toggle"
              type="button"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

          <div class="strength">

            <div
              id="strengthBar"
              class="strength-bar"
            ></div>

          </div>

          <span
            id="strengthText"
            class="strength-text"
          >
            Use at least 6 characters.
          </span>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="field">

          <label
            class="field-label"
            for="confirmPassword"
          >
            Confirm password
          </label>

          <div class="input-wrap">

            <input
              id="confirmPassword"
              class="password-input"
              type="password"
              placeholder="Enter your password again"
              autocomplete="new-password"
              required
            >

            <button
              id="confirmPasswordToggle"
              class="password-toggle"
              type="button"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <!-- TERMS -->

        <label class="terms">

          <input
            id="terms"
            type="checkbox"
            required
          >

          <span>
            I understand that Chatverix uses my account information
            to provide the messaging service.
          </span>

        </label>


        <button
          id="signupBtn"
          class="primary-btn"
          type="submit"
        >
          Create Account
        </button>

      </form>


      <div
        id="message"
        class="message"
      ></div>


      <p class="switch-auth">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </p>

    </section>


    <div class="footer-note">
      Chatverix • Secure realtime conversations
    </div>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      set,
      get,
      query,
      orderByChild,
      equalTo
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


    /* =========================
       FIREBASE
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAEWxTJ1loQkXM1ShwAAF1J15RQLlCgdGM",

      authDomain:
        "msgapp-262c9.firebaseapp.com",

      projectId:
        "msgapp-262c9",

      storageBucket:
        "msgapp-262c9.appspot.com",

      messagingSenderId:
        "122648836940",

      appId:
        "1:122648836940:web:a098c052f65f3eb305ade9",

      databaseURL:
        "https://msgapp-262c9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getDatabase(app);

    const provider =
      new GoogleAuthProvider();


    /* =========================
       DOM
    ========================= */

    const signupForm =
      document.getElementById("signupForm");

    const usernameInput =
      document.getElementById("username");

    const nicknameInput =
      document.getElementById("nickname");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const termsInput =
      document.getElementById("terms");

    const signupBtn =
      document.getElementById("signupBtn");

    const googleBtn =
      document.getElementById("googleBtn");

    const message =
      document.getElementById("message");

    const usernameStatus =
      document.getElementById("usernameStatus");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const confirmPasswordToggle =
      document.getElementById("confirmPasswordToggle");

    const strengthBar =
      document.getElementById("strengthBar");

    const strengthText =
      document.getElementById("strengthText");


    /* =========================
       HELPERS
    ========================= */

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      message.className =
        `message show ${type}`;
    }


    function hideMessage() {

      message.textContent = "";

      message.className =
        "message";
    }


    function setLoading(
      button,
      loading,
      text
    ) {

      if (loading) {

        button.dataset.originalText =
          button.textContent;

        button.innerHTML =
          `<span class="spinner"></span>`;

        button.classList.add("loading");

        button.disabled = true;

      } else {

        button.textContent =
          text ||
          button.dataset.originalText ||
          "Continue";

        button.classList.remove("loading");

        button.disabled = false;

      }

    }


    function friendlyError(error) {

      const code =
        error?.code || "";

      const messages = {

        "auth/email-already-in-use":
          "An account already exists with this email.",

        "auth/invalid-email":
          "Please enter a valid email address.",

        "auth/weak-password":
          "Your password is too weak.",

        "auth/popup-closed-by-user":
          "Google signup was cancelled.",

        "auth/popup-blocked":
          "Your browser blocked the Google signup popup.",

        "auth/network-request-failed":
          "Network error. Check your internet connection.",

        "auth/operation-not-allowed":
          "This sign-in method is currently disabled."
      };

      return messages[code] ||
        error?.message ||
        "Something went wrong. Please try again.";

    }


    /* =========================
       PASSWORD TOGGLE
    ========================= */

    function setupPasswordToggle(
      button,
      input
    ) {

      button.addEventListener(
        "click",
        () => {

          const showing =
            input.type === "text";

          input.type =
            showing
              ? "password"
              : "text";

          button.textContent =
            showing
              ? "👁"
              : "🙈";

        }
      );

    }


    setupPasswordToggle(
      passwordToggle,
      passwordInput
    );

    setupPasswordToggle(
      confirmPasswordToggle,
      confirmPasswordInput
    );


    /* =========================
       USERNAME
    ========================= */

    function validateUsername(
      username
    ) {

      return /^[a-zA-Z0-9_]{3,24}$/
        .test(username);

    }


    let usernameCheckTimer =
      null;


    usernameInput.addEventListener(
      "input",
      () => {

        clearTimeout(
          usernameCheckTimer
        );

        const username =
          usernameInput.value
            .trim()
            .toLowerCase();

        usernameStatus.textContent =
          "";

        usernameStatus.className =
          "username-status";

        if (!username) return;

        if (!validateUsername(username)) {

          usernameStatus.textContent =
            "Invalid";

          usernameStatus.classList.add(
            "bad"
          );

          return;
        }

        usernameStatus.textContent =
          "Checking…";

        usernameCheckTimer =
          setTimeout(
            async () => {

              try {

                const usernameQuery =
                  query(
                    ref(db, "users"),
                    orderByChild("username"),
                    equalTo(username)
                  );

                const snapshot =
                  await get(usernameQuery);

                if (
                  usernameInput.value
                    .trim()
                    .toLowerCase() !== username
                ) {
                  return;
                }

                if (snapshot.exists()) {

                  usernameStatus.textContent =
                    "Taken";

                  usernameStatus.classList.add(
                    "bad"
                  );

                } else {

                  usernameStatus.textContent =
                    "Available";

                  usernameStatus.classList.add(
                    "good"
                  );

                }

              } catch (error) {

                console.error(
                  "Username check:",
                  error
                );

                usernameStatus.textContent =
                  "";

              }

            },
            400
          );

      }
    );


    /* =========================
       PASSWORD STRENGTH
    ========================= */

    function calculateStrength(
      password
    ) {

      let score = 0;

      if (password.length >= 6)
        score++;

      if (password.length >= 10)
        score++;

      if (/[A-Z]/.test(password))
        score++;

      if (/[0-9]/.test(password))
        score++;

      if (/[^A-Za-z0-9]/.test(password))
        score++;

      return Math.min(score, 5);

    }


    passwordInput.addEventListener(
      "input",
      () => {

        const password =
          passwordInput.value;

        const score =
          calculateStrength(password);

        const widths = [
          "0%",
          "20%",
          "40%",
          "60%",
          "80%",
          "100%"
        ];

        strengthBar.style.width =
          widths[score];

        if (!password) {

          strengthText.textContent =
            "Use at least 6 characters.";

          return;

        }

        if (score <= 1) {

          strengthText.textContent =
            "Weak password";

        } else if (score <= 3) {

          strengthText.textContent =
            "Decent password";

        } else {

          strengthText.textContent =
            "Strong password";

        }

      }
    );


    /* =========================
       GOOGLE SIGNUP
    ========================= */

    googleBtn.addEventListener(
      "click",
      async () => {

        hideMessage();

        setLoading(
          googleBtn,
          true,
          "Continue with Google"
        );

        try {

          const result =
            await signInWithPopup(
              auth,
              provider
            );

          const user =
            result.user;

          const userRef =
            ref(
              db,
              `users/${user.uid}`
            );

          const snapshot =
            await get(userRef);

          /*
           * Existing account:
           * simply enter Chatverix.
           */

          if (snapshot.exists()) {

            location.href =
              "index.html";

            return;
          }


          /*
           * New Google account.
           *
           * We keep the same database structure
           * your existing app.js expects.
           */

          let username = "";

          while (!username) {

            username =
              prompt(
                "Choose your Chatverix username:"
              );

            if (username === null) {

              await auth.signOut();

              return;
            }

            username =
              username
                .trim()
                .toLowerCase();

            if (
              !validateUsername(username)
            ) {

              alert(
                "Username must be 3–24 characters and contain only letters, numbers, or underscores."
              );

              username = "";

              continue;
            }


            const usernameQuery =
              query(
                ref(db, "users"),
                orderByChild("username"),
                equalTo(username)
              );

            const usernameSnap =
              await get(usernameQuery);

            if (usernameSnap.exists()) {

              alert(
                "That username is already taken."
              );

              username = "";

            }

          }


          let nickname =
            prompt(
              "Choose your nickname:"
            );

          nickname =
            nickname?.trim() ||
            user.displayName ||
            username;


          await set(
            userRef,
            {

              uid:
                user.uid,

              email:
                user.email || "",

              username,

              nickname,

              photoURL:
                user.photoURL || "",

              createdAt:
                Date.now(),

              lastLogin:
                Date.now()

            }
          );


          location.href =
            "index.html";

        } catch (error) {

          console.error(error);

          showMessage(
            friendlyError(error)
          );

          setLoading(
            googleBtn,
            false,
            "Continue with Google"
          );

        }

      }
    );


    /* =========================
       MANUAL SIGNUP
    ========================= */

    signupForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        hideMessage();


        const username =
          usernameInput.value
            .trim()
            .toLowerCase();

        const nickname =
          nicknameInput.value.trim();

        const email =
          emailInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        /* USERNAME */

        if (!validateUsername(username)) {

          showMessage(
            "Username must be 3–24 characters and can only contain letters, numbers, and underscores."
          );

          usernameInput.focus();

          return;
        }


        /* NICKNAME */

        if (nickname.length < 2) {

          showMessage(
            "Your nickname must contain at least 2 characters."
          );

          nicknameInput.focus();

          return;
        }


        /* EMAIL */

        if (!email.includes("@")) {

          showMessage(
            "Enter a valid email address."
          );

          emailInput.focus();

          return;
        }


        /* PASSWORD */

        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters."
          );

          passwordInput.focus();

          return;
        }


        /* CONFIRM */

        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "Passwords do not match."
          );

          confirmPasswordInput.focus();

          return;
        }


        /* TERMS */

        if (!termsInput.checked) {

          showMessage(
            "Please confirm the account terms before continuing."
          );

          return;
        }


        setLoading(
          signupBtn,
          true,
          "Create Account"
        );


        try {

          /* CHECK USERNAME */

          const usernameQuery =
            query(
              ref(db, "users"),
              orderByChild("username"),
              equalTo(username)
            );

          const usernameSnap =
            await get(usernameQuery);


          if (usernameSnap.exists()) {

            throw new Error(
              "That username is already taken."
            );

          }


          /* CREATE FIREBASE ACCOUNT */

          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          const user =
            userCredential.user;


          /* VERIFICATION EMAIL */

          await sendEmailVerification(
            user
          );


          /* USER PROFILE */

          await set(
            ref(
              db,
              `users/${user.uid}`
            ),
            {

              uid:
                user.uid,

              email,

              username,

              nickname,

              photoURL:
                "",

              createdAt:
                Date.now(),

              lastLogin:
                Date.now()

            }
          );


          showMessage(
            "Account created! A verification email has been sent to your inbox.",
            "success"
          );


          /*
           * Sign out so the user has to
           * verify/login normally.
           */

          await auth.signOut();


          setTimeout(
            () => {
              location.href =
                "login.html";
            },
            1200
          );


        } catch (error) {

          console.error(error);

          showMessage(
            friendlyError(error)
          );

          setLoading(
            signupBtn,
            false,
            "Create Account"
          );

        }

      }
    );


    /* =========================
       PREVENT STRAY AUTH STATE
    ========================= */

    onAuthStateChanged(
      auth,
      user => {

        /*
         * We intentionally don't redirect
         * immediately here during signup,
         * because the newly created account
         * must first show the verification message.
         */

      }
    );

  </script>
