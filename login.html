<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chatverix — Login</title>
  <meta name="theme-color" content="#071018">

  <link rel="icon" type="image/png" href="FAVICON.png?v=3">

  <style>
    :root {
      --bg: #050b10;
      --bg-2: #07131b;
      --panel: rgba(13, 25, 32, 0.82);
      --panel-solid: #0d1920;

      --border: rgba(255, 255, 255, 0.075);
      --border-hover: rgba(37, 211, 102, 0.35);

      --text: #f4f8f6;
      --muted: #91a19f;
      --muted-2: #667673;

      --accent: #25d366;
      --accent-2: #1ebe57;
      --accent-soft: rgba(37, 211, 102, 0.12);

      --danger: #ff5c68;
      --warning: #f5c451;

      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(37, 211, 102, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(26, 115, 232, 0.08),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #03080c 0%,
          #071018 45%,
          #06131a 100%
        );

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    /* BACKGROUND */

    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 280px;
      height: 280px;
      background: rgba(37, 211, 102, 0.14);
      left: -80px;
      top: -80px;
    }

    .orb.two {
      width: 240px;
      height: 240px;
      background: rgba(39, 117, 255, 0.12);
      right: -80px;
      bottom: -70px;
      animation-delay: -4s;
    }

    .orb.three {
      width: 160px;
      height: 160px;
      background: rgba(37, 211, 102, 0.08);
      right: 20%;
      top: 10%;
      animation-delay: -8s;
    }

    @keyframes floatOrb {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(25px, -20px, 0) scale(1.08);
      }
    }

    /* MAIN */

    .auth-shell {
      width: min(440px, calc(100% - 32px));
      position: relative;
      z-index: 2;

      animation: shellIn 0.65s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes shellIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .auth-card {
      position: relative;

      padding: 34px;

      border: 1px solid var(--border);
      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(20, 36, 43, 0.88),
          rgba(8, 17, 23, 0.92)
        );

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

      overflow: hidden;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(37, 211, 102, 0.55),
        transparent
      );
    }

    /* BRAND */

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 62px;
      height: 62px;

      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          rgba(37, 211, 102, 0.20),
          rgba(37, 211, 102, 0.055)
        );

      border: 1px solid rgba(37, 211, 102, 0.18);

      box-shadow:
        0 12px 35px rgba(37, 211, 102, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

      animation: iconFloat 4s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .brand-icon span {
      font-size: 29px;
    }

    .brand-name {
      margin: 0;

      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #b8f8cc
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-subtitle {
      margin: 7px 0 0;

      color: var(--muted);
      font-size: 13px;
    }

    .title {
      margin: 0 0 6px;
      font-size: 21px;
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* GOOGLE */

    .google-btn {
      width: 100%;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 13px;

      background: rgba(255, 255, 255, 0.96);
      color: #111;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, .22);
      background: #fff;
    }

    .google-btn:active {
      transform: translateY(0) scale(.985);
    }

    .google-btn img {
      width: 18px;
      height: 18px;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 21px 0;
    }

    .divider span {
      height: 1px;
      flex: 1;
      background: rgba(255, 255, 255, 0.07);
    }

    .divider p {
      margin: 0;
      color: var(--muted-2);
      font-size: 12px;
    }

    /* FORM */

    .field {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;

      color: #b9c5c2;
      font-size: 12px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 13px;

      outline: none;

      background: rgba(2, 10, 15, 0.70);
      color: white;

      font-size: 14px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input::placeholder {
      color: #536360;
    }

    input:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    input:focus {
      border-color: rgba(37, 211, 102, 0.48);

      background: rgba(2, 10, 15, 0.88);

      box-shadow:
        0 0 0 3px rgba(37, 211, 102, 0.08),
        0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .password-input {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;

      right: 5px;
      top: 5px;

      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 10px;

      background: transparent;
      color: #74817e;

      cursor: pointer;

      transition:
        color .2s ease,
        background .2s ease;
    }

    .password-toggle:hover {
      color: white;
      background: rgba(255, 255, 255, 0.06);
    }

    /* OPTIONS */

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 3px 1px 17px;

      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;

      color: var(--muted);

      cursor: pointer;
    }

    .remember input {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
    }

    .forgot {
      color: #79dc9a;
      text-decoration: none;
      cursor: pointer;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    /* BUTTON */

    .primary-btn {
      width: 100%;
      height: 49px;

      border: 0;
      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #2bdd6d,
          #1ebd58
        );

      color: #031009;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(37, 211, 102, 0.13);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);

      box-shadow:
        0 14px 30px rgba(37, 211, 102, 0.18);
    }

    .primary-btn:active {
      transform: translateY(0) scale(.985);
    }

    .primary-btn.loading {
      pointer-events: none;
      opacity: .75;
    }

    /* SPINNER */

    .spinner {
      width: 17px;
      height: 17px;

      border: 2px solid rgba(0, 0, 0, .2);
      border-top-color: #031009;

      border-radius: 50%;

      display: inline-block;

      animation: spin .7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ERROR */

    .message {
      display: none;

      margin: 14px 0 0;
      padding: 11px 12px;

      border-radius: 11px;

      font-size: 12px;
      line-height: 1.45;

      animation: messageIn .25s ease;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffb7bd;
      background: rgba(255, 92, 104, 0.08);
      border: 1px solid rgba(255, 92, 104, 0.15);
    }

    .message.success {
      color: #a8efbd;
      background: rgba(37, 211, 102, 0.08);
      border: 1px solid rgba(37, 211, 102, 0.15);
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FOOTER */

    .switch-auth {
      text-align: center;
      margin: 20px 0 0;

      color: var(--muted);
      font-size: 13px;
    }

    .switch-auth a {
      color: #7ae49a;
      font-weight: 700;
      text-decoration: none;
    }

    .switch-auth a:hover {
      text-decoration: underline;
    }

    .footer-note {
      text-align: center;

      margin-top: 17px;

      color: #4e5d59;
      font-size: 10px;
    }

    /* MOBILE */

    @media (max-width: 520px) {
      body {
        align-items: flex-start;
        overflow-y: auto;
      }

      .auth-shell {
        width: calc(100% - 22px);
        margin: 30px 0;
      }

      .auth-card {
        padding: 27px 21px;
        border-radius: 19px;
      }

      .brand-name {
        font-size: 27px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>

  <main class="auth-shell">

    <section class="auth-card">

      <div class="brand">
        <div class="brand-icon">
          <span>💬</span>
        </div>

        <h1 class="brand-name">Chatverix</h1>

        <p class="brand-subtitle">
          Your conversations. Your rooms. Your space.
        </p>
      </div>

      <h2 class="title">Welcome back</h2>

      <p class="subtitle">
        Sign in to continue chatting.
      </p>

      <button id="googleBtn" class="google-btn" type="button">
        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt=""
        >
        <span>Continue with Google</span>
      </button>

      <div class="divider">
        <span></span>
        <p>OR</p>
        <span></span>
      </div>

      <form id="loginForm">

        <div class="field">
          <label class="field-label" for="identifier">
            Username or email
          </label>

          <input
            id="identifier"
            type="text"
            placeholder="Enter your username or email"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>

        <div class="field">

          <label class="field-label" for="password">
            Password
          </label>

          <div class="input-wrap">

            <input
              id="password"
              class="password-input"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              id="passwordToggle"
              class="password-toggle"
              type="button"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>

        <div class="options">

          <label class="remember">
            <input id="rememberMe" type="checkbox">
            <span>Remember me</span>
          </label>

          <a id="forgotPassword" class="forgot">
            Forgot password?
          </a>

        </div>

        <button
          id="loginBtn"
          class="primary-btn"
          type="submit"
        >
          Login
        </button>

      </form>

      <div id="message" class="message"></div>

      <p class="switch-auth">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

    </section>

    <div class="footer-note">
      Chatverix • Secure realtime conversations
    </div>

  </main>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      get,
      query,
      orderByChild,
      equalTo
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


    /* =========================
       FIREBASE
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyAEWxTJ1loQkXM1ShwAAF1J15RQLlCgdGM",
      authDomain: "msgapp-262c9.firebaseapp.com",
      projectId: "msgapp-262c9",
      storageBucket: "msgapp-262c9.appspot.com",
      messagingSenderId: "122648836940",
      appId: "1:122648836940:web:a098c052f65f3eb305ade9",
      databaseURL:
        "https://msgapp-262c9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const provider = new GoogleAuthProvider();


    /* =========================
       DOM
    ========================= */

    const loginForm = document.getElementById("loginForm");
    const identifierInput = document.getElementById("identifier");
    const passwordInput = document.getElementById("password");

    const loginBtn = document.getElementById("loginBtn");
    const googleBtn = document.getElementById("googleBtn");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const forgotPassword =
      document.getElementById("forgotPassword");

    const rememberMe =
      document.getElementById("rememberMe");

    const message =
      document.getElementById("message");


    /* =========================
       HELPERS
    ========================= */

    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className =
        `message show ${type}`;

    }


    function hideMessage() {

      message.textContent = "";
      message.className = "message";

    }


    function setLoading(button, loading, text) {

      if (loading) {

        button.dataset.originalText =
          button.textContent;

        button.innerHTML =
          `<span class="spinner"></span>`;

        button.classList.add("loading");

        button.disabled = true;

      } else {

        button.textContent =
          text || button.dataset.originalText || "Continue";

        button.classList.remove("loading");

        button.disabled = false;

      }

    }


    function friendlyError(error) {

      const code = error?.code || "";

      const messages = {

        "auth/invalid-credential":
          "Incorrect username/email or password.",

        "auth/invalid-login-credentials":
          "Incorrect username/email or password.",

        "auth/user-not-found":
          "No account was found with those details.",

        "auth/wrong-password":
          "Incorrect password.",

        "auth/too-many-requests":
          "Too many attempts. Please wait a little and try again.",

        "auth/popup-closed-by-user":
          "Google sign-in was cancelled.",

        "auth/popup-blocked":
          "Your browser blocked the Google sign-in popup.",

        "auth/network-request-failed":
          "Network error. Check your internet connection.",

        "auth/invalid-email":
          "That email address is not valid."
      };

      return messages[code] ||
        error?.message ||
        "Something went wrong. Please try again.";

    }


    /* =========================
       REMEMBER ME
    ========================= */

    const savedIdentifier =
      localStorage.getItem("chatverixRememberedIdentifier");

    if (savedIdentifier) {

      identifierInput.value =
        savedIdentifier;

      rememberMe.checked = true;

    }


    /* =========================
       PASSWORD TOGGLE
    ========================= */

    passwordToggle.addEventListener("click", () => {

      const showing =
        passwordInput.type === "text";

      passwordInput.type =
        showing ? "password" : "text";

      passwordToggle.textContent =
        showing ? "👁" : "🙈";

      passwordToggle.setAttribute(
        "aria-label",
        showing
          ? "Show password"
          : "Hide password"
      );

    });


    /* =========================
       GOOGLE LOGIN
    ========================= */

    googleBtn.addEventListener("click", async () => {

      hideMessage();

      setLoading(
        googleBtn,
        true,
        "Continue with Google"
      );

      try {

        await signInWithPopup(
          auth,
          provider
        );

        location.href = "index.html";

      } catch (error) {

        console.error(error);

        showMessage(
          friendlyError(error)
        );

        setLoading(
          googleBtn,
          false,
          "Continue with Google"
        );

      }

    });


    /* =========================
       USERNAME → EMAIL
    ========================= */

    async function resolveEmail(identifier) {

      const value =
        identifier.trim();

      if (value.includes("@")) {
        return value;
      }

      const username =
        value.toLowerCase();

      const usernameQuery =
        query(
          ref(db, "users"),
          orderByChild("username"),
          equalTo(username)
        );

      const snapshot =
        await get(usernameQuery);

      let foundUser = null;

      snapshot.forEach(child => {
        foundUser = child.val();
      });

      if (!foundUser?.email) {
        throw new Error(
          "No account was found with that username."
        );
      }

      return foundUser.email;

    }


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        hideMessage();

        const identifier =
          identifierInput.value.trim();

        const password =
          passwordInput.value;

        if (!identifier) {

          showMessage(
            "Enter your username or email."
          );

          identifierInput.focus();

          return;
        }

        if (!password) {

          showMessage(
            "Enter your password."
          );

          passwordInput.focus();

          return;
        }

        setLoading(
          loginBtn,
          true,
          "Login"
        );

        try {

          const email =
            await resolveEmail(identifier);

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          if (rememberMe.checked) {

            localStorage.setItem(
              "chatverixRememberedIdentifier",
              identifier
            );

          } else {

            localStorage.removeItem(
              "chatverixRememberedIdentifier"
            );

          }

          showMessage(
            "Login successful. Opening Chatverix…",
            "success"
          );

          setTimeout(() => {
            location.href = "index.html";
          }, 350);

        } catch (error) {

          console.error(error);

          showMessage(
            friendlyError(error)
          );

          setLoading(
            loginBtn,
            false,
            "Login"
          );

        }

      }
    );


    /* =========================
       FORGOT PASSWORD
    ========================= */

    forgotPassword.addEventListener(
      "click",
      async () => {

        hideMessage();

        const identifier =
          identifierInput.value.trim();

        if (!identifier) {

          showMessage(
            "Enter your email address or username first."
          );

          identifierInput.focus();

          return;
        }

        try {

          const email =
            await resolveEmail(identifier);

          await sendPasswordResetEmail(
            auth,
            email
          );

          showMessage(
            "Password reset email sent. Check your inbox.",
            "success"
          );

        } catch (error) {

          console.error(error);

          showMessage(
            friendlyError(error)
          );

        }

      }
    );


    /* =========================
       ALREADY LOGGED IN
    ========================= */

    onAuthStateChanged(auth, user => {

      if (user) {

        location.href = "index.html";

      }

    });

  </script>

</body>
</html>
